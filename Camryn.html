<!DOCTYPE html>
<html>
<head>

<title>Pink Zombie Survival 🩷</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#ffd9ee;
    font-family:"Comic Sans MS",cursive;
    text-align:center;
}


canvas{

    background:#bdefff;
    border:8px solid #ff8fcf;
    border-radius:25px;
    box-shadow:0 0 30px pink;

}


#ui{

position:absolute;
top:15px;
left:20px;

font-size:22px;
font-weight:bold;

color:#ff4fa3;

}


button{

background:#ff8fcf;
border:none;
border-radius:30px;

padding:12px 25px;

font-size:18px;
color:white;

cursor:pointer;

}


button:hover{

background:#ff5cad;

}



#gameOver{

display:none;

position:absolute;
top:220px;
width:100%;

font-size:45px;

color:#ff4fa3;

font-weight:bold;

}


</style>

</head>


<body>


<div id="ui">

💗 Health:
<span id="health">5</span>

&nbsp;

⭐ Score:
<span id="score">0</span>

&nbsp;

🌸 Wave:
<span id="wave">1</span>

&nbsp;

🏆 High:
<span id="high">0</span>

</div>



<canvas id="game" width="900" height="600"></canvas>


<br>

<button onclick="paused=!paused">
🌸 Pause
</button>



<div id="gameOver">

Game Over 💔

<br>

<button onclick="restartGame()">
Restart
</button>

</div>




<script>


const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");



let score=0;

let health=5;

let wave=1;

let gameRunning=true;

let paused=false;



let highScore=
localStorage.getItem("pinkZombieHighScore") || 0;


document.getElementById("high").innerHTML=highScore;



let player={

x:450,

y:350,

size:35,

speed:5,

cooldown:0

};



let keys={};



document.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true;


if(e.code==="Space"){

shoot();

}


});



document.addEventListener("keyup",e=>{

keys[e.key.toLowerCase()]=false;

});





// SOUND SYSTEM


let audioCtx;


function sound(freq,time){


if(!audioCtx)

audioCtx=new AudioContext();



let osc=audioCtx.createOscillator();

let gain=audioCtx.createGain();



osc.frequency.value=freq;


osc.connect(gain);

gain.connect(audioCtx.destination);



osc.start();



gain.gain.exponentialRampToValueAtTime(

0.001,

audioCtx.currentTime+time

);



osc.stop(
audioCtx.currentTime+time
);


}





// BACKGROUND



let clouds=[

{x:100,y:80},

{x:450,y:120},

{x:750,y:70}

];


let flowers=[];


for(let i=0;i<60;i++){


flowers.push({

x:Math.random()*900,

y:150+Math.random()*450

});


}




function drawBackground(){



ctx.fillStyle="#8edcff";

ctx.fillRect(0,0,900,150);



// clouds


ctx.fillStyle="white";


clouds.forEach(c=>{


ctx.beginPath();

ctx.arc(c.x,c.y,25,0,Math.PI*2);

ctx.arc(c.x+30,c.y,20,0,Math.PI*2);

ctx.arc(c.x-30,c.y,20,0,Math.PI*2);

ctx.fill();



c.x+=0.2;


if(c.x>950)

c.x=-50;


});



// grass


ctx.fillStyle="#b9f7b0";

ctx.fillRect(0,150,900,450);



// flowers


flowers.forEach(f=>{


ctx.fillStyle="#ff69b4";

ctx.beginPath();

ctx.arc(f.x,f.y,5,0,Math.PI*2);

ctx.fill();



ctx.fillStyle="#ffd700";

ctx.beginPath();

ctx.arc(f.x,f.y,2,0,Math.PI*2);

ctx.fill();



});


}




// PLAYER



function drawPlayer(){


ctx.fillStyle="#ff69b4";


ctx.beginPath();

ctx.arc(

player.x,

player.y,

player.size,

0,

Math.PI*2

);

ctx.fill();



// bunny ears


ctx.fillRect(

player.x-22,

player.y-60,

14,

35

);


ctx.fillRect(

player.x+10,

player.y-60,

14,

35

);



// eyes


ctx.fillStyle="black";


ctx.beginPath();

ctx.arc(player.x-10,player.y-5,5,0,Math.PI*2);

ctx.fill();


ctx.beginPath();

ctx.arc(player.x+10,player.y-5,5,0,Math.PI*2);

ctx.fill();


// smile


ctx.strokeStyle="black";

ctx.beginPath();

ctx.arc(player.x,player.y+10,12,0,Math.PI);

ctx.stroke();



}




function movePlayer(){


if(keys["w"]||keys["arrowup"])

player.y-=player.speed;


if(keys["s"]||keys["arrowdown"])

player.y+=player.speed;


if(keys["a"]||keys["arrowleft"])

player.x-=player.speed;


if(keys["d"]||keys["arrowright"])

player.x+=player.speed;



player.x=Math.max(40,Math.min(860,player.x));

player.y=Math.max(190,Math.min(560,player.y));



if(player.cooldown>0)

player.cooldown--;


}

// =====================
// ZOMBIES
// =====================


let zombies=[];


function spawnZombie(){


let z={

x:Math.random()*900,

y:200+Math.random()*400,

size:30,

speed:1+wave*.15,

health:1,

color:"#9ee69b"

};



let chance=Math.random();


if(chance<0.15){

z.size=60;

z.health=5;

z.speed=.5;

z.color="#d6a7ff";

}



else if(chance<0.35){

z.size=22;

z.speed=2.5;

z.color="#ffe89a";

}



zombies.push(z);


}




setInterval(()=>{


if(gameRunning && !paused){


for(let i=0;i<wave;i++){

spawnZombie();

}


}


},3000);







function drawZombies(){


zombies.forEach(z=>{


ctx.fillStyle=z.color;


ctx.beginPath();

ctx.arc(
z.x,
z.y,
z.size,
0,
Math.PI*2
);

ctx.fill();



// eyes

ctx.fillStyle="white";


ctx.beginPath();

ctx.arc(z.x-10,z.y-5,8,0,Math.PI*2);

ctx.fill();


ctx.beginPath();

ctx.arc(z.x+10,z.y-5,8,0,Math.PI*2);

ctx.fill();



// pupils

ctx.fillStyle="black";


ctx.beginPath();

ctx.arc(z.x-10,z.y-5,3,0,Math.PI*2);

ctx.fill();


ctx.beginPath();

ctx.arc(z.x+10,z.y-5,3,0,Math.PI*2);

ctx.fill();


// silly smile

ctx.strokeStyle="black";

ctx.beginPath();

ctx.arc(z.x,z.y+10,12,0,Math.PI);

ctx.stroke();



});

}





function moveZombies(){


zombies.forEach(z=>{


let dx=player.x-z.x;

let dy=player.y-z.y;


let dist=Math.sqrt(dx*dx+dy*dy);



z.x+=(dx/dist)*z.speed;

z.y+=(dy/dist)*z.speed;



if(dist<player.size+z.size){


health--;


document.getElementById("health").innerHTML=health;


sound(150,.2);



z.x=Math.random()*900;

z.y=200+Math.random()*300;



if(health<=0){


gameRunning=false;


document.getElementById("gameOver").style.display="block";


}



}


});


}








// =====================
// BUBBLE WEAPON
// =====================


let bubbles=[];


function shoot(){


if(player.cooldown>0)return;



bubbles.push({

x:player.x,

y:player.y,

size:12,

speed:8

});



player.cooldown=15;


sound(600,.08);


}






function updateBubbles(){


bubbles.forEach(b=>{


b.x+=b.speed;


});



bubbles=bubbles.filter(b=>b.x<900);


}





function drawBubbles(){


bubbles.forEach(b=>{


ctx.fillStyle="white";


ctx.beginPath();

ctx.arc(
b.x,
b.y,
b.size,
0,
Math.PI*2
);

ctx.fill();



ctx.strokeStyle="#ff8fcf";

ctx.stroke();



});



}








// =====================
// COLLISIONS
// =====================


function checkHits(){


bubbles.forEach((b,bi)=>{


zombies.forEach((z,zi)=>{


let dx=b.x-z.x;

let dy=b.y-z.y;


let d=Math.sqrt(dx*dx+dy*dy);



if(d<z.size){


z.health--;


bubbles.splice(bi,1);



if(z.health<=0){


sparkle(z.x,z.y);

sound(300,.15);


zombies.splice(zi,1);



score+=10;


document.getElementById("score").innerHTML=score;



if(score>highScore){


highScore=score;


localStorage.setItem(
"pinkZombieHighScore",
highScore
);


document.getElementById("high").innerHTML=highScore;


}




if(score%100===0){


wave++;


document.getElementById("wave").innerHTML=wave;


}



}



}



});


});


}







// =====================
// POWERUPS
// =====================


let powerups=[];


function spawnPowerup(){


let list=["💗","🧁","⭐","💎"];



powerups.push({

x:Math.random()*850+25,

y:200+Math.random()*350,

type:list[Math.floor(Math.random()*list.length)]

});


}



setInterval(()=>{


if(gameRunning)

spawnPowerup();


},8000);






function drawPowerups(){


powerups.forEach(p=>{


ctx.font="30px Arial";


ctx.fillText(
p.type,
p.x,
p.y
);


});


}




function collectPowerups(){


powerups.forEach((p,i)=>{


let dx=player.x-p.x;

let dy=player.y-p.y;


let d=Math.sqrt(dx*dx+dy*dy);



if(d<40){


sound(800,.1);



if(p.type==="💗")

health=Math.min(5,health+1);



if(p.type==="🧁")

score+=50;



if(p.type==="⭐")

score+=100;



if(p.type==="💎"){


player.speed=8;


setTimeout(()=>{

player.speed=5;

},5000);


}



document.getElementById("health").innerHTML=health;

document.getElementById("score").innerHTML=score;



powerups.splice(i,1);


}



});


}








// =====================
// SPARKLES
// =====================


let particles=[];



function sparkle(x,y){


for(let i=0;i<15;i++){


particles.push({

x:x,

y:y,

dx:(Math.random()-0.5)*5,

dy:(Math.random()-0.5)*5,

life:30

});


}


}



function drawParticles(){


particles.forEach((p,i)=>{


ctx.fillStyle="#fff";


ctx.fillRect(
p.x,
p.y,
5,
5
);



p.x+=p.dx;

p.y+=p.dy;


p.life--;



if(p.life<=0)

particles.splice(i,1);



});


}








// =====================
// GAME LOOP
// =====================


function gameLoop(){


if(!gameRunning)return;



if(!paused){


ctx.clearRect(
0,
0,
900,
600
);



drawBackground();


movePlayer();


moveZombies();


updateBubbles();


checkHits();


collectPowerups();



drawPlayer();


drawZombies();


drawBubbles();


drawPowerups();


drawParticles();



}



requestAnimationFrame(gameLoop);



}



gameLoop();







function restartGame(){


location.reload();


}



</script>


</body>

</html>
