<!DOCTYPE html>
<html>
<head>

<title>Stompy Stomp 🐰💗</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

background:#ffd8eb;

font-family:"Comic Sans MS", Arial, sans-serif;

overflow:hidden;

}



/* GAME */

#game{

width:900px;

max-width:100%;

height:450px;

margin:20px auto;

position:relative;

overflow:hidden;

background:
linear-gradient(
#ffc7df,
#fff2f8
);

border-radius:30px;

border-bottom:75px solid #ff9fc8;

box-shadow:
0 15px 30px rgba(255,80,150,.3);

}



/* SCORE */

#score{

position:absolute;

top:15px;

left:20px;

font-size:22px;

font-weight:bold;

color:#d94f8a;

z-index:20;

}



/* CLOUDS */

.cloud{

position:absolute;

font-size:60px;

opacity:.8;

animation:
cloudMove linear infinite;

}


.cloud1{

top:40px;

animation-duration:18s;

}


.cloud2{

top:100px;

font-size:45px;

animation-duration:25s;

animation-delay:5s;

}


.cloud3{

top:70px;

font-size:35px;

animation-duration:30s;

animation-delay:10s;

}



@keyframes cloudMove{

from{

left:100%;

}

to{

left:-200px;

}

}





/* BUNNY */


#bunny{

position:absolute;

left:120px;

bottom:70px;

width:70px;

height:65px;

background:white;

border-radius:50%;

z-index:10;

box-shadow:
0 5px 12px rgba(0,0,0,.15);

animation:
run .25s infinite alternate;

}



@keyframes run{

from{

transform:translateY(0);

}

to{

transform:translateY(-5px);

}

}



.jumping{

animation:none!important;

}




/* EARS */

.ear{

position:absolute;

width:20px;

height:50px;

background:white;

border-radius:50%;

top:-40px;

}


.ear.left{

left:12px;

}


.ear.right{

right:12px;

}



.innerEar{

position:absolute;

width:10px;

height:32px;

background:#ff9fc8;

border-radius:50%;

left:5px;

top:8px;

}



/* FACE */


.eye{

position:absolute;

width:9px;

height:9px;

background:#333;

border-radius:50%;

top:28px;

}


.eye.left{

left:18px;

}


.eye.right{

right:18px;

}



.nose{

position:absolute;

width:9px;

height:7px;

background:#ff7fae;

border-radius:50%;

top:40px;

left:31px;

}



.cheek{

position:absolute;

width:14px;

height:8px;

background:#ffb6d9;

border-radius:50%;

top:42px;

}


.cheek.left{

left:7px;

}


.cheek.right{

right:7px;

}




.tail{

position:absolute;

width:28px;

height:28px;

background:white;

border-radius:50%;

right:-20px;

bottom:10px;

}




/* DUCK */


.duck{

height:40px!important;

width:80px!important;

animation:none!important;

}




/* SPIKES */


.spike{

position:absolute;

bottom:70px;

font-size:60px;

color:#ff6f9f;

text-shadow:
0 5px #c94d78;

}




/* BIRD */


.bird{

position:absolute;

width:50px;

height:38px;

background:#55c9ff;

border-radius:50%;

z-index:5;

animation:
birdMove .3s infinite alternate;

}


.bird:before{

content:"";

position:absolute;

width:30px;

height:16px;

background:#9de4ff;

border-radius:50%;

top:-5px;

left:8px;

}



.bird:after{

content:"";

position:absolute;

width:7px;

height:7px;

background:black;

border-radius:50%;

right:10px;

top:10px;

}



@keyframes birdMove{

from{

transform:translateY(0);

}

to{

transform:translateY(-8px);

}

}



/* GAME OVER */


#gameOver{

display:none;

position:absolute;

top:140px;

width:100%;

text-align:center;

background:#fff0f7;

padding:25px;

font-size:35px;

color:#d94f8a;

z-index:50;

}




/* BUTTONS */


button{

padding:12px 25px;

border:none;

border-radius:20px;

background:#ff78b4;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

margin:5px;

}



button:hover{

background:#ff4f98;

}




.controls{

text-align:center;

}


#game:fullscreen{

width:100vw;

height:100vh;

border-radius:0;

margin:0;

}


</style>

</head>


<body>


<div id="game">


<div id="score">
Score: 0
</div>


<div class="cloud cloud1">
☁️
</div>

<div class="cloud cloud2">
☁️
</div>

<div class="cloud cloud3">
☁️
</div>


<div id="bunny">


<div class="ear left">
<div class="innerEar"></div>
</div>


<div class="ear right">
<div class="innerEar"></div>
</div>


<div class="eye left"></div>

<div class="eye right"></div>


<div class="nose"></div>


<div class="cheek left"></div>

<div class="cheek right"></div>


<div class="tail"></div>


</div>



<div id="gameOver">

GAME OVER 🐰💔

<br><br>

<button onclick="restart()">
Play Again
</button>

</div>



</div>



<div class="controls">

<button onclick="jump()">
🐰 Jump
</button>


<button onclick="duck()">
🌸 Duck
</button>


<button onclick="fullscreenGame()">
⛶ Fullscreen
</button>


</div>
<script>


// ===============================
// ELEMENTS
// ===============================


const bunny = document.getElementById("bunny");

const game = document.getElementById("game");

const scoreText =
document.getElementById("score");

const gameOver =
document.getElementById("gameOver");




// ===============================
// GAME VARIABLES
// ===============================


let score = 0;

let highScore =
localStorage.getItem("stompyHigh") || 0;


let speed = 7;

let playing = true;



// bunny physics

let bunnyY = 0;

let velocity = 0;

let gravity = .8;

let jumping = false;

let groundHeight = 70;



// ===============================
// SOUND SYSTEM
// ===============================


let audioContext;



function startAudio(){

if(!audioContext){

audioContext =
new(window.AudioContext ||
window.webkitAudioContext)();

}

}




function playSound(type){

startAudio();


let oscillator =
audioContext.createOscillator();


let gain =
audioContext.createGain();


oscillator.connect(gain);

gain.connect(audioContext.destination);



if(type==="jump"){

oscillator.frequency.value=600;

}


if(type==="hit"){

oscillator.frequency.value=120;

}



gain.gain.value=.12;


oscillator.start();


oscillator.stop(
audioContext.currentTime+.15
);


}





// ===============================
// SIMPLE MUSIC
// ===============================


let musicPlaying=false;


function playMusic(){

if(musicPlaying)
return;


musicPlaying=true;


function note(){


if(!playing)
return;


startAudio();


let osc =
audioContext.createOscillator();


let gain =
audioContext.createGain();



osc.connect(gain);

gain.connect(audioContext.destination);



osc.frequency.value =
220 + Math.random()*100;


gain.gain.value=.025;


osc.start();


osc.stop(
audioContext.currentTime+.4
);



setTimeout(note,1200);


}


note();


}





// ===============================
// CONTROLS
// ===============================



document.addEventListener(
"keydown",
function(e){


if(e.code==="Space" ||
e.code==="ArrowUp"){

jump();

}


if(e.code==="ArrowDown"){

duck();

}


if(e.code==="KeyR"){

restart();

}


});





function jump(){


if(!jumping && playing){


velocity = 14;


jumping=true;


bunny.classList.add(
"jumping"
);


playSound("jump");


playMusic();


}


}




function duck(){


if(!playing)
return;


bunny.classList.add(
"duck"
);



setTimeout(()=>{


bunny.classList.remove(
"duck"
);


},400);


}






// ===============================
// JUMP PHYSICS
// ===============================


function physics(){


if(!playing)
return;



bunnyY += velocity;


velocity -= gravity;



if(bunnyY <= 0){


bunnyY=0;


velocity=0;


jumping=false;


bunny.classList.remove(
"jumping"
);


}



bunny.style.bottom =
(groundHeight+bunnyY)+"px";



requestAnimationFrame(
physics
);


}


physics();





// ===============================
// CREATE OBSTACLES
// ===============================


function spawnObstacle(){


if(!playing)
return;



let obstacle =
document.createElement("div");



let isBird =
Math.random()>.65;



if(isBird){


obstacle.className="bird";



// lower birds for ducking

if(Math.random()>.5){


obstacle.style.bottom =
"95px";


}

else{


obstacle.style.bottom =
"180px";


}


}

else{


obstacle.className="spike";



let amount =
Math.floor(Math.random()*3)+1;



obstacle.innerHTML =
"▲".repeat(amount);



}



obstacle.style.left="900px";


game.appendChild(obstacle);



moveObstacle(obstacle);


}




function moveObstacle(obstacle){


let position=900;



let timer=setInterval(()=>{


if(!playing){

clearInterval(timer);

return;

}



position-=speed;



obstacle.style.left =
position+"px";



if(checkCollision(obstacle)){


endGame();


}



if(position < -150){


obstacle.remove();


clearInterval(timer);


}



},20);


}





function obstacleLoop(){


if(!playing)
return;



spawnObstacle();



setTimeout(

obstacleLoop,

1800+
Math.random()*1200

);


}
  // ===============================
// COLLISION
// ===============================


function checkCollision(obstacle){


let bunnyBox =
bunny.getBoundingClientRect();


let obstacleBox =
obstacle.getBoundingClientRect();



// forgiving hitbox

return(

bunnyBox.left + 15 <
obstacleBox.right &&


bunnyBox.right - 15 >
obstacleBox.left &&


bunnyBox.top + 15 <
obstacleBox.bottom &&


bunnyBox.bottom - 10 >
obstacleBox.top

);


}





// ===============================
// SCORE
// ===============================


function scoreLoop(){


if(!playing)
return;



score++;



scoreText.innerHTML =

"Score: " +
score +
" | Best: " +
highScore;




// increase difficulty

if(score % 500 === 0){

speed += .5;

}





requestAnimationFrame(
scoreLoop
);


}





// ===============================
// GAME OVER
// ===============================


function endGame(){


if(!playing)
return;



playing=false;


playSound("hit");



if(score > highScore){


highScore = score;


localStorage.setItem(
"stompyHigh",
highScore
);


}



gameOver.style.display =
"block";



}







// ===============================
// RESTART
// ===============================


function restart(){



document.querySelectorAll(
".spike,.bird"
)

.forEach(
object=>object.remove()
);



score=0;


speed=7;


playing=true;



bunnyY=0;

velocity=0;

jumping=false;



bunny.style.bottom =
groundHeight+"px";



gameOver.style.display =
"none";



obstacleLoop();

scoreLoop();



}






// ===============================
// FULLSCREEN
// ===============================


function fullscreenGame(){



if(!document.fullscreenElement){


game.requestFullscreen();


}

else{


document.exitFullscreen();


}



}





// ===============================
// START GAME
// ===============================


obstacleLoop();


scoreLoop();


</script>


</body>

</html>
